<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indus University - Bonafide Certificate Request</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header and Navigation Bar -->
    <header class="navbar">
        <div class="brand-container">
            <img src="OIP (1).jpg" alt="Indus Logo" class="brand-logo">
            <a href="index.html" class="logo" style="color: darkblue; text-decoration: none;"></a>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html" class="logout-btn">Logout</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="page-container">
        <!-- Back to Dashboard Link -->
        <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>

        <div class="portal-box">
            <h2>Bonafide Certificate Request</h2>
            <p class="desc">Apply online for an official university bonafide letter.</p>

            <!-- Bonafide Application Form -->
            <form id="bonafideForm" onsubmit="requestBonafide(event)">
                <!-- Student Name -->
                <div class="input-group">
                    <label for="studentName">Student Full Name:</label>
                    <input type="text" id="studentName" placeholder="Enter your full name" required>
                </div>

                <!-- Enrollment Number -->
                <div class="input-group">
                    <label for="enrollmentNo">Enrollment Number:</label>
                    <input type="text" id="enrollmentNo" placeholder="Enter student enrollment number" required>
                </div>

                <!-- Semester Dropdown (1 to 8) -->
                <div class="input-group">
                    <label for="semester">Current Semester:</label>
                    <select id="semester" required>
                        <option value="">-- Select Semester --</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>

                <!-- Reason for Request -->
                <div class="input-group">
                    <label for="reason">Reason for Request:</label>
                    <textarea id="reason" rows="4"
                        placeholder="State reason (e.g., Passport application, Education Loan, Bus pass)"
                        required></textarea>
                </div>

                <button type="submit" class="calc-btn">Submit Request</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Indus University - Student Portal</p>
    </footer>

    <!-- Beginner-friendly Vanilla JavaScript Form Handler -->
    <script>
        function requestBonafide(event) {
            // Stop form from refreshing the page
            event.preventDefault();

            // Display confirmation alert
            alert('Bonafide Request sent to Admin Department.');

            // Clear all input fields using form.reset()
            document.getElementById("bonafideForm").reset();
        }
    </script>

</body>

</html>
